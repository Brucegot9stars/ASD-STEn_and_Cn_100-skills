name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify English skill
        working-directory: asd-ste100-technical-writing
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_en.py --strict examples/after.md

      - name: Verify Chinese skill
        working-directory: ste-zh-technical-writing
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_zh.py --strict examples/after.md
          python scripts/check_zh.py --strict SKILL.md references/writing-rules.md references/word-list.md references/checklist.md

      - name: Build archives
        run: python scripts/package.py --tag "${GITHUB_REF_NAME}"

      - name: List archives
        run: ls -lh dist/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --generate-notes --title "$TAG" --verify-tag
          fi
